{% extends 'base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}<section class="surface form-panel mx-auto" style="max-width:480px"><p class="eyebrow">SESI CONHECIMENTO</p><h1>Entrar</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label><div>{{ field }}</div>{{ field.errors }}</div>{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary" type="submit">Entrar</button></form></section>{% endblock %}
